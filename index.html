<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MarsWork</title>
    <meta
      name="description"
      content="MarsWork is a personal productivity dashboard for todos, clock, calendar, weather, favorites, quotes, and focus."
    />

    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#faf9f6" />

    <link rel="icon" href="./assets/icons/icon-32.png" sizes="32x32" />
    <link rel="icon" href="./assets/icons/icon-192.png" sizes="192x192" />

    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div id="root">
      <header class="header">
        <div class="header__left">
          <button class="header-action" type="button" aria-label="Menu">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="icon header-action__icon"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M8.25 4.5l7.5 7.5-7.5 7.5"
              />
            </svg>
          </button>

          <div class="header-menu">
            <div class="menu-panel">
              <button class="menu-item">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="menu-item__icon"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M12 6v6l3 3M12 3a9 9 0 1 1 0 18a9 9 0 0 1 0-18Z"
                  />
                </svg>
                <span class="menu-item__label">Alarm</span>
              </button>
            </div>
          </div>
        </div>

        <div class="header__center">
          <input id="search" type="text" placeholder="Search..." />
        </div>

        <div class="header__right">
          <button
            class="header-status header-status--clickable header-status--deadline"
            type="button"
            aria-label="Deadline"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="icon header-status__icon"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6.75 3v2.25M17.25 3v2.25M3.75 8.25h16.5M5.25 5.25h13.5A1.5 1.5 0 0 1 20.25 6.75v12A1.5 1.5 0 0 1 18.75 20.25H5.25A1.5 1.5 0 0 1 3.75 18.75v-12A1.5 1.5 0 0 1 5.25 5.25Z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M8.25 12h3.75M8.25 15h6"
              />
            </svg>

            <span class="header-status__label">프로젝트명</span>
            <span class="header-status__value">D-12</span>
          </button>

          <div
            class="header-status header-status--weather"
            aria-label="Weather"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="icon header-status__icon"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 3.75v2.25M12 18v2.25M4.97 4.97l1.59 1.59M17.44 17.44l1.59 1.59M3.75 12h2.25M18 12h2.25M4.97 19.03l1.59-1.59M17.44 6.56l1.59-1.59"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 8.25a3.75 3.75 0 1 1 0 7.5a3.75 3.75 0 0 1 0-7.5Z"
              />
            </svg>

            <span class="header-status__label">Seoul</span>
            <span class="header-status__meta">Rain</span>
            <span class="header-status__value">28°C</span>
          </div>
        </div>
      </header>

      <main class="main">
        <div class="main__content main__favorites">
          <button class="favorite-item favorite-item--folder" type="button">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="favorite-item__icon"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M2.25 6.75A2.25 2.25 0 0 1 4.5 4.5h4.19c.6 0 1.17.24 1.59.66l1.06 1.06c.42.42.99.66 1.59.66h6.57a2.25 2.25 0 0 1 2.25 2.25v8.37a2.25 2.25 0 0 1-2.25 2.25h-15A2.25 2.25 0 0 1 2.25 17.5V6.75Z"
              />
            </svg>
            <span class="favorite-item__label">Folder</span>
          </button>

          <button class="favorite-item favorite-item--file" type="button">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="favorite-item__icon"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M19.5 14.25v-6.88c0-.4-.16-.78-.44-1.06l-3.37-3.37a1.5 1.5 0 0 0-1.06-.44H6A1.5 1.5 0 0 0 4.5 4v16A1.5 1.5 0 0 0 6 21.5h12A1.5 1.5 0 0 0 19.5 20v-5.75Z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M14.25 2.5V7a1.5 1.5 0 0 0 1.5 1.5h3.75"
              />
            </svg>
            <span class="favorite-item__label">File</span>
          </button>
        </div>

        <div class="main__content main__clock">
          <div class="clock">
            <span class="clock__date"></span>
            <span class="clock__time">00:00:00</span>
          </div>
        </div>
        <div class="main__content main__todo-form">Todo Form</div>
        <div class="main__content main__calendar">Calendar</div>
        <div class="main__content main__greeting main__login">
          <div class="greeting hidden">
            <span class="greeting__message"></span>
            <span class="greeting__name"></span>
          </div>

          <form id="login" class="hidden">
            <input
              required
              maxlength="15"
              type="text"
              placeholder="Please login..."
            />
          </form>
        </div>
        <div class="main__content main__todos">Todos</div>
      </main>

      <footer class="footer">
        <div class="footer__quotes">
          <div class="footer__quotes--content">
            좋은 결정은 경험에서 나오고, 좋은 경험은 나쁜 결정에서 나온다.
          </div>
          <div class="footer__quotes--author">- 마크 트웨인 -</div>
        </div>
      </footer>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
